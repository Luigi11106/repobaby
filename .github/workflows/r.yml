name: R CI (run, test, format)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  runandtest:
    if: false # enable/disable job
    # job disabled because at the moment I see two options:
      # 1. add every new library manually to the workflow yaml - no
      # 2. work with renv and maybe forget to snapshot and then cry - no
    name: Gate 1 - Run & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
           extra-packages: |
             any::tidyverse
             any::ggplot2
             any::haven
             any::here
             # add used packages here or alternatively work with renv.lock file
      
      - name: Run R scripts
        run: |
          for file in code/*.R; do
            Rscript "$file"
          done
      
      - name: Render Quarto files
        run: quarto render

  formatcheck:
    name: Gate 2 - Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
      
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
           extra-packages: |
             any::styler
             any::knitr
      
      - name: Check Formatting
        run: Rscript -e "styler::style_dir('.', dry = 'fail')"